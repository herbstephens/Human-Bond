<script>
var scale = 1;
var svg = document.getElementById('diagram');

function zoom(delta) {
  scale = Math.min(Math.max(scale + delta, 0.2), 4);
  applyZoom();
}

function resetZoom() {
  // Fit to window width
  var container = svg.parentElement;
  var containerW = container.clientWidth - 40;
  scale = Math.min(containerW / 1440, 1);
  applyZoom();
}

function applyZoom() {
  svg.style.width = (1440 * scale) + 'px';
  svg.style.height = 'auto';
  document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
}

// Set initial zoom to fit window
window.addEventListener('load', function() {
  resetZoom();
});

// Mouse wheel zoom
document.querySelector('div[style]').addEventListener('wheel', function(e) {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    zoom(e.deltaY > 0 ? -0.05 : 0.05);
  }
}, { passive: false });
</script>
